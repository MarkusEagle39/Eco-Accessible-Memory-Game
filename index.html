<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11141c">
  <meta name="description" content="Eco: jogo de memória simples por toque, som e vibração.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- URL versionada para impedir que navegadores móveis/desktop reutilizem CSS antigo. -->
  <link rel="stylesheet" href="style.css?v=20261001-2">
  <title>Eco — Memória por toque e vibração</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand"><h1>Eco</h1><p>MEMÓRIA POR TOQUE E VIBRAÇÃO</p></div>
      <div class="level-box" aria-label="Nível atual"><strong id="level">0</strong><span>NÍVEL</span></div>
    </header>

    <section class="settings" aria-label="Opções do jogo">
      <label class="toggle"><input id="soundToggle" type="checkbox" checked><span class="check" aria-hidden="true"></span><span>Som</span></label>
      <label class="toggle"><input id="vibToggle" type="checkbox" checked><span class="check" aria-hidden="true"></span><span>Vibração</span></label>
      <label class="speed-control" aria-label="Velocidade da sequência">
        <span class="sr-only">Velocidade da sequência</span>
        <select id="speedSelect">
          <option value="rapido">Rápido</option>
          <option value="normal" selected>Normal</option>
          <option value="demorado">Demorado</option>
        </select>
      </label>
    </section>

    <section class="controls" aria-label="Controles do jogo">
      <button id="startBtn" class="start" type="button"><span aria-hidden="true">▶</span> Iniciar jogo</button>
      <p id="status" class="status">Toque em “Iniciar jogo” para começar.</p>
    </section>

    <section class="board" aria-label="Toque nos lados para repetir a sequência">
      <button class="pad left" id="leftPad" type="button" aria-label="Esquerda. Um pulso e um tom grave.">
        <span class="pad-content"><span class="signal" aria-hidden="true"><i></i></span><span class="pad-label">Esquerda</span></span>
      </button>
      <button class="pad right" id="rightPad" type="button" aria-label="Direita. Dois pulsos e um tom agudo.">
        <span class="pad-content"><span class="signal double" aria-hidden="true"><i></i><i></i></span><span class="pad-label">Direita</span></span>
      </button>
    </section>
    <p id="live" class="sr-only" aria-live="assertive" aria-atomic="true"></p>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
